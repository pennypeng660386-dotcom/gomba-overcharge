*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 20%,#3b1400 0,#090909 36%,#000 78%);color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1440px;margin:auto;padding:24px}.hero{min-height:86vh;display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:center}

.feature{background:#111c;border:1px solid #632900;border-radius:16px;padding:18px}.feature b{display:block;color:#ff9a1a;margin-bottom:7px}
.actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.play{display:inline-flex;text-decoration:none;color:#fff;background:linear-gradient(90deg,#ff4f00,#ff9200);font-weight:900;font-size:26px;padding:20px 34px;border-radius:14px;box-shadow:0 0 28px #ff650066}
.qr{background:#fff;padding:10px;border-radius:12px;width:160px;height:160px}.url{color:#ffc36b;font-weight:700;margin-top:18px}
footer{border-top:1px solid #352113;padding:26px 0;color:#aaa;text-align:center}
@media(max-width:850px){.hero{grid-template-columns:1fr}.wrap{padding:14px}.features{grid-template-columns:1fr}.qr{width:140px;height:140px}}
